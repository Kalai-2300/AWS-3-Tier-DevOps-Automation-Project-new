name: 3-Tier DevOps Deployment Pipeline

on:
  push:
    branches:
      - main

env:
  DOCKER_HUB_USER: "kalai2300"
  EC2_PUBLIC_IP: "your-aws-ec2-public-ip"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout Code from GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "kalai2300" 
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 3. Build Frontend and Backend Docker Images
      - name: Build Docker Images
        run: |
          docker build -t kalai2300/my-app:latest .

      # 4. Push Images to Docker Hub
      - name: Push Docker Images
        run: |
          docker push kalai2300/my-app:latest

      # 5. SSH into AWS EC2 and Deploy Both Containers
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Login to Docker Hub inside AWS Server
            echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "kalai2300" --password-stdin

            # 2. Stop and remove old container if running
            docker stop my-app-container || true
            docker rm my-app-container || true

            # 3. Pull latest image and Run Container
            docker pull kalai2300/my-app:latest
            docker run -d -p 3000:3000 --name my-app-container kalai2300/my-app:latest