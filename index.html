<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps 3-Tier Web App</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding-top: 80px; background-color: #f3f4f6; }
        .container { background: white; padding: 40px; border-radius: 12px; display: inline-block; box-shadow: 0px 10px 20px rgba(0,0,0,0.05); max-width: 500px; }
        h1 { color: #2563eb; margin-bottom: 5px; } /* Enterprise Blue */
        h3 { color: #4b5563; font-weight: 400; margin-top: 0; }
        .badge { background: #e0e7ff; color: #4338ca; padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; display: inline-block; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 14px; color: #374151; font-weight: 600; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 6px; font-size: 16px; }
        button { background: #2563eb; color: white; padding: 12px 20px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>3-Tier DevOps Project Live! .🌐</h1>
        <h3>Presentation Tier (Frontend)</h3>
        <span class="badge">Managed by Nginx & Docker</span>
        
        <!-- பயனர் விபரங்களை என்டர் செய்யும் ஃபார்ம் -->
        <div class="form-group">
            <label for="username">Full Name</label>
            <input type="text" id="username" placeholder="Enter your name">
        </div>
        <div class="form-group">
            <label for="useremail">Email Address</label>
            <input type="email" id="useremail" placeholder="name@company.com">
        </div>
        <button onclick="submitData()">Save Data to Database</button>
    </div>

    <script>
        // இந்த பங்க்ஷன் தான் போர்ட் 5000-ல் இருக்கும் பேக்-எண்ட் அப்ளிகேஷன் லேயர் கூட பேசும்
        function submitData() {
            alert("Data captured on Frontend! Ready to be sent to Application Tier (Backend).");
        }
    </script>
</body>
</html>
